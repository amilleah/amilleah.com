[build]
  command = "node src/render.js && node src/notice.js"
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/feed.xml"
  to = "/.netlify/functions/feed"
  status = 200

[[redirects]]
  from = "/rss/img/*"
  to = "/.netlify/functions/images/:splat"
  status = 200
  force = true

# --- top-level canonical URLs: serve the SPA shell. Non-force, so real files
#     (/css, /research, /projects/<slug>/index.html fragments, functions) win. ---
[[redirects]]
  from = "/here"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/color"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/kitty"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/tarot"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/writing"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/zines"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/colophon"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/guestbook"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/rss"
  to = "/index.html"
  status = 200

#---- legacy redirect...
[[redirects]]
  from = "/projects/:slug"
  to = "/:slug"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
